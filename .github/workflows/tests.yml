name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src app tests
      - name: Test
        # Data integrity tests need the raw StatsBomb download, so they skip here.
        # Everything else runs on the committed data/processed/ files.
        run: pytest -rs --cov --cov-report=term
