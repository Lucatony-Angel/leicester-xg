[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "build_db", "champions", "common", "conftest", "evaluate", "formations",
                     "freeze_frame", "simulate", "team_stats", "train"]

[tool.coverage.run]
source = ["src", "app"]
omit = ["src/download.py"]

[tool.ruff.lint.per-file-ignores]
"app/common.py" = ["F401"]  # re-exports used by the pages
